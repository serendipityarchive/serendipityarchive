<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serendipity Archive</title>
<style>
  :root{
    --vermillion:#E3401F;
    --vermillion-deep:#C22F13;
    --ink:#241505;
    --cream:#FBF3E7;
    --gold:#D9A441;
    --card-shadow: rgba(36,21,5,0.35);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--vermillion);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(0,0,0,0.08), transparent 45%);
    color:var(--cream);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative;
    padding:28px 24px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .corner-link{
    position:absolute;
    top:22px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px var(--card-shadow);
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  .corner-link:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 6px 14px var(--card-shadow);
  }
  .corner-link.cosmos{ left:24px; }
  .corner-link.pinterest{ right:24px; }
  .corner-link img,
  .corner-link svg{
    width:20px;
    height:20px;
  }

  .title-block{
    text-align:center;
  }

  .eyebrow{
    display:block;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.75);
    margin-bottom:6px;
  }

  h1{
    margin:0;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:clamp(32px, 6vw, 58px);
    letter-spacing:-0.02em;
    color:var(--cream);
  }

  .subtitle{
    margin:10px 0 0;
    font-size:14px;
    color:rgba(251,243,231,0.8);
    letter-spacing:0.02em;
  }

  /* ---------- GRID ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px;
  }

  figure{
    margin:0;
    background:var(--cream);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 8px 20px var(--card-shadow);
    position:relative;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  figure:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px rgba(36,21,5,0.45);
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    overflow:hidden;
    background:#00000010;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.02);
  }

  .tag{
    position:absolute;
    top:10px;
    left:-6px;
    background:var(--vermillion-deep);
    color:var(--cream);
    font-size:11px;
    letter-spacing:0.06em;
    padding:3px 10px 3px 12px;
    border-radius:0 3px 3px 0;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }

  figcaption{
    padding:12px 14px 16px;
    color:var(--ink);
  }
  figcaption .work-title{
    display:block;
    font-weight:700;
    font-size:14px;
    letter-spacing:-0.01em;
    margin-bottom:2px;
  }
  figcaption .work-meta{
    display:block;
    font-size:12px;
    color:#5c4a34;
    font-family:Georgia, "Times New Roman", serif;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:24px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.6);
  }

  @media (prefers-reduced-motion: reduce){
    figure, .corner-link{ transition:none; }
  }
</style>
</head>
<body>

<header>
  
  <div class="title-block">
    <span class="eyebrow">PERSONAL CATALOGUE &middot; HAPISSPT</span>
    <h1>Serendipity Archive</h1>
    <p class="subtitle">BEST OF 2026</p>
  </div>

</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<footer>SPT &middot; UPTD</footer>

<script>
  const works = [
    { src: "sankarea.jpg", title: "SANKAREA", medium: "beloved undead", year: "2026" },
    { src: "hanekawa.jpg", title: "HANEKAWA", medium: "intelligent madamoiselle", year: "2026" },
    { src: "gentildonna.jpg", title: "GENTILDONNA", medium: "elegance meets performance", year: "2026" },
    { src: "schooldays.jpg", title: "KATSURA", medium: "contextual", year: "2026" },
    { src: "bouquetdor.jpg", title: "BOUQUETD'OR", medium: "silver collector", year: "2026" },
    { src: "marriagetoxin.jpg", title: "KINOSAKI", medium: "steal her looks", year: "2026" },
    { src: "senjougahara.jpg", title: "HITAGI", medium: "sharp tongue", year: "2026" },
    { src: "urabe.jpg", title: "URABE", medium: "mysterious", year: "2026" },

  ];

  const gallery = document.getElementById("gallery");

  works.forEach((w, i) => {
    const num = String(i + 1).padStart(3, "0");
    const fig = document.createElement("figure");
    fig.innerHTML = `
      <div class="frame">
        <span class="tag">No. ${num}</span>
        <img src="${w.src}" alt="${w.title}" loading="lazy">
      </div>
      <figcaption>
        <span class="work-title">${w.title}</span>
        <span class="work-meta">${w.medium}, ${w.year}</span>
      </figcaption>
    `;
    gallery.appendChild(fig);
  });
</script>

</body>
</html>
