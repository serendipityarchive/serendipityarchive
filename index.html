<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serendipity Archive</title>
<style>
  :root{
    --vermillion:#E3401F;
    --vermillion-deep:#C22F13;
    --ink:#241505;
    --cream:#FBF3E7;
    --gold:#D9A441;
    --card-shadow: rgba(36,21,5,0.35);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--vermillion);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(0,0,0,0.08), transparent 45%);
    color:var(--cream);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative;
    padding:28px 24px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .corner-link{
    position:absolute;
    top:22px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px var(--card-shadow);
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  .corner-link:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 6px 14px var(--card-shadow);
  }
  .corner-link.cosmos{ left:24px; }
  .corner-link.pinterest{ right:24px; }
  .corner-link img,
  .corner-link svg{
    width:20px;
    height:20px;
  }

  .title-block{
    text-align:center;
  }

  .eyebrow{
    display:block;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.75);
    margin-bottom:6px;
  }

  h1{
    margin:0;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:clamp(32px, 6vw, 58px);
    letter-spacing:-0.02em;
    color:var(--cream);
  }

  .subtitle{
    margin:10px 0 0;
    font-size:14px;
    color:rgba(251,243,231,0.8);
    letter-spacing:0.02em;
  }

  /* ---------- GRID ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px;
  }

  figure{
    margin:0;
    background:var(--cream);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 8px 20px var(--card-shadow);
    position:relative;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  figure:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px rgba(36,21,5,0.45);
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#00000010;
  }
  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.02);
  }

  .tag{
    position:absolute;
    top:10px;
    left:-6px;
    background:var(--vermillion-deep);
    color:var(--cream);
    font-size:11px;
    letter-spacing:0.06em;
    padding:3px 10px 3px 12px;
    border-radius:0 3px 3px 0;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
  }

  figcaption{
    padding:12px 14px 16px;
    color:var(--ink);
  }
  figcaption .work-title{
    display:block;
    font-weight:700;
    font-size:14px;
    letter-spacing:-0.01em;
    margin-bottom:2px;
  }
  figcaption .work-meta{
    display:block;
    font-size:12px;
    color:#5c4a34;
    font-family:Georgia, "Times New Roman", serif;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:24px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:rgba(251,243,231,0.6);
  }

  @media (prefers-reduced-motion: reduce){
    figure, .corner-link{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <a class="corner-link cosmos" href="https://cosmos.so/hapisspt" target="_blank" rel="noopener" title="Cosmos profile">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9" stroke="#241505" stroke-width="1.6"/>
      <ellipse cx="12" cy="12" rx="9" ry="3.4" stroke="#241505" stroke-width="1.6"/>
      <ellipse cx="12" cy="12" rx="3.4" ry="9" stroke="#241505" stroke-width="1.6"/>
    </svg>
  </a>

  <div class="title-block">
    <span class="eyebrow">PERSONAL CATALOGUE &middot; HAPISSPT</span>
    <h1>Serendipity Archive</h1>
    <p class="subtitle">BEST OF 2026</p>
  </div>

  <a class="corner-link pinterest" href="https://pinterest.com/hapisspt" target="_blank" rel="noopener" title="Pinterest profile">
    <svg viewBox="0 0 24 24" fill="#241505" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12c0 4.23 2.63 7.85 6.34 9.31-.09-.79-.17-2.01.03-2.88.19-.79 1.23-5.02 1.23-5.02s-.31-.63-.31-1.55c0-1.46.85-2.55 1.9-2.55.9 0 1.33.67 1.33 1.48 0 .9-.57 2.25-.87 3.5-.25 1.04.53 1.9 1.56 1.9 1.87 0 3.31-1.97 3.31-4.82 0-2.52-1.81-4.28-4.4-4.28-3 0-4.76 2.25-4.76 4.57 0 .9.35 1.87.78 2.4a.31.31 0 0 1 .07.3c-.08.33-.26 1.04-.29 1.19-.05.19-.15.24-.35.14-1.31-.61-2.13-2.52-2.13-4.06 0-3.31 2.4-6.35 6.93-6.35 3.64 0 6.47 2.59 6.47 6.06 0 3.62-2.28 6.53-5.45 6.53-1.06 0-2.06-.55-2.4-1.21l-.65 2.49c-.24.9-.87 2.04-1.3 2.73.98.3 2.02.46 3.1.46 5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
    </svg>
  </a>
</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<footer>SPT &middot; UPTD</footer>

<script>
  const works = [
    { src: "converted.jpg", title: "Curren Bouquetd'or", medium: "Silver Collector", year: "2026" }
  ];

  const gallery = document.getElementById("gallery");

  works.forEach((w, i) => {
    const num = String(i + 1).padStart(3, "0");
    const fig = document.createElement("figure");
    fig.innerHTML = `
      <div class="frame">
        <span class="tag">No. ${num}</span>
        <img src="${w.src}" alt="${w.title}" loading="lazy">
      </div>
      <figcaption>
        <span class="work-title">${w.title}</span>
        <span class="work-meta">${w.medium}, ${w.year}</span>
      </figcaption>
    `;
    gallery.appendChild(fig);
  });
</script>

</body>
</html>
